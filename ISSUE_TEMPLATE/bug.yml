name: Bug report
description: Something does not work as it should
title: "fix: "
labels: ["type: bug"]
projects: ["Lectern-HQ/1"]
body:
  - type: markdown
    attributes:
      value: |
        Never paste cookie values, cookie files, passwords or signed links. For a security problem, do not use this form: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Lectern or library version, or commit.
  - type: input
    id: system
    attributes:
      label: System and browser
      placeholder: macOS 27, Dia
